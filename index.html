<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Tasks</title>
    <script>
      // Apply saved theme / style / background before first paint to avoid a flash.
      // Defaults: dark theme, glass style, aurora background.
      (function () {
        var t = "dark", s = "glass", b = "aurora";
        try {
          if (localStorage.getItem("theme") === "light") t = "light";
          if (localStorage.getItem("style") === "solid") s = "solid";
          var v = localStorage.getItem("bg");
          if (v === "sunset" || v === "ocean" || v === "forest" || v === "mono") b = v;
        } catch (e) {}
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.setAttribute("data-style", s);
        r.setAttribute("data-bg", b);
        // On Linux the app runs WebKitGTK with compositing disabled, where
        // backdrop-filter doesn't render: glass then uses denser fills instead of blur.
        if (/Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent)) r.setAttribute("data-noblur", "");
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/glass.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main class="app">
      <!-- ================= List view ================= -->
      <div class="list-view" id="list-view">
        <header class="header">
          <button class="icon-btn" id="prev-day" title="Previous day (Alt+←)" aria-label="Previous day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <div class="day">
            <h1 id="day-label">Today</h1>
            <p id="day-sub" class="day-sub"></p>
          </div>
          <button class="icon-btn" id="next-day" title="Next day (Alt+→)" aria-label="Next day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
          <button class="today-btn" id="today-btn" title="Jump to today (T)">Today</button>
          <div class="menu-wrap">
            <button class="icon-btn" id="menu-btn" title="Settings" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="12" cy="19" r="1.4" /></svg>
            </button>
            <div class="menu" id="menu" role="menu" hidden>
              <div class="menu-row">
                <span class="menu-label">Theme</span>
                <div class="seg seg-sm" role="group" aria-label="Theme">
                  <button type="button" data-theme-set="dark">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>Dark
                  </button>
                  <button type="button" data-theme-set="light">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>Light
                  </button>
                </div>
              </div>
              <div class="menu-row">
                <span class="menu-label">Style</span>
                <div class="seg seg-sm seg-style" role="group" aria-label="Style">
                  <button type="button" data-style-set="solid">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" /></svg>Solid
                  </button>
                  <button type="button" data-style-set="glass">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.2 4.4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.8-6.6 6-11z" /><path d="M9.5 14.5a2.5 2.5 0 0 0 2 2.4" /></svg>Glass
                  </button>
                </div>
              </div>
              <div class="menu-row menu-bg-row">
                <span class="menu-label">Background</span>
                <div class="swatches" role="radiogroup" aria-label="Background">
                  <button type="button" class="swatch" role="radio" data-bg-set="aurora" title="Aurora" aria-label="Aurora"></button>
                  <button type="button" class="swatch" role="radio" data-bg-set="sunset" title="Sunset" aria-label="Sunset"></button>
                  <button type="button" class="swatch" role="radio" data-bg-set="ocean" title="Ocean" aria-label="Ocean"></button>
                  <button type="button" class="swatch" role="radio" data-bg-set="forest" title="Forest" aria-label="Forest"></button>
                  <button type="button" class="swatch" role="radio" data-bg-set="mono" title="Mono" aria-label="Mono"></button>
                </div>
              </div>
              <div class="menu-sep"></div>
              <button type="button" class="menu-item" id="menu-open-data" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
                <span class="menu-item-text">
                  <span>Open data folder</span>
                  <span class="menu-sub" id="menu-data-path"></span>
                </span>
              </button>
              <button type="button" class="menu-item" id="menu-update" role="menuitem" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
                <span class="menu-item-text">
                  <span>Check for updates</span>
                  <span class="menu-sub" id="menu-version"></span>
                </span>
              </button>
              <div class="menu-sep"></div>
              <button type="button" class="menu-item danger" id="menu-wipe" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" /></svg>
                <span>Delete all data…</span>
              </button>
            </div>
          </div>
        </header>

        <section class="progress" aria-live="polite">
          <div class="progress-text"><span id="progress-label">0 / 0 done</span><span id="progress-pct"></span></div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </section>

        <form class="add" id="add-form" autocomplete="off">
          <button type="button" class="prio-toggle" id="add-priority" data-priority="normal"
            title="Priority: normal (click to change)" aria-label="Priority: normal">
            <span class="dot"></span>
          </button>
          <input id="add-input" type="text" placeholder="Add a task…  (Ctrl+N or /)" maxlength="500" />
          <button type="submit" class="add-btn" aria-label="Add task">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </form>

        <div class="banner" id="carry-banner" hidden>
          <span id="carry-text"></span>
          <button type="button" id="carry-btn">Move to today</button>
        </div>

        <nav class="tabs" role="tablist">
          <button role="tab" data-filter="all" class="tab">All <span class="count" data-count="all"></span></button>
          <button role="tab" data-filter="active" class="tab">Active <span class="count" data-count="active"></span></button>
          <button role="tab" data-filter="done" class="tab">Done <span class="count" data-count="done"></span></button>
        </nav>

        <ul class="list" id="task-list"></ul>

        <div class="empty" id="empty" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8" /><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" /></svg>
          </div>
          <p class="empty-title" id="empty-title"></p>
          <p class="empty-sub" id="empty-sub"></p>
        </div>

        <footer class="footer">
          <span class="hint">Alt+←/→ days · T today · / add</span>
          <button type="button" class="link-btn" id="clear-done" hidden>Clear completed</button>
        </footer>
      </div>

      <!-- ================= Detail view ================= -->
      <section class="detail" id="detail" hidden aria-label="Task details">
        <header class="detail-head">
          <button class="back-btn" id="detail-back" title="Back to list (Esc, Alt+←, mouse back)" aria-label="Back to list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            <span class="detail-crumb" id="detail-crumb"></span>
          </button>
          <span class="detail-spacer"></span>
          <button class="icon-btn danger" id="detail-delete" title="Delete task" aria-label="Delete task">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" /></svg>
          </button>
        </header>

        <div class="detail-scroll" id="detail-scroll">
          <div class="detail-title-row">
            <button type="button" class="check big" id="detail-check" role="checkbox" aria-checked="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            </button>
            <textarea id="detail-title" class="detail-title" rows="1" maxlength="500" spellcheck="true"
              aria-label="Title"></textarea>
          </div>

          <div class="props">
            <label class="prop">
              <span class="prop-label">Date</span>
              <input type="date" id="detail-date" class="date-input" required />
            </label>
            <div class="prop">
              <span class="prop-label">Priority</span>
              <div class="seg seg-prio" id="detail-priority" role="group" aria-label="Priority">
                <button type="button" data-p="low"><span class="dot" data-priority="low"></span>Low</button>
                <button type="button" data-p="normal"><span class="dot" data-priority="normal"></span>Normal</button>
                <button type="button" data-p="high"><span class="dot" data-priority="high"></span>High</button>
              </div>
            </div>
          </div>

          <section class="section">
            <div class="section-head">
              <h2>Notes</h2>
              <span class="section-status" id="notes-status" aria-live="polite"></span>
            </div>
            <textarea id="detail-notes" class="notes" placeholder="Add notes, details, links…" aria-label="Notes"></textarea>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Resources <span class="count" id="att-count"></span></h2>
              <div class="section-actions">
                <button type="button" class="chip-btn" id="add-files">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5" /><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>
                  Add files
                </button>
                <button type="button" class="chip-btn" id="add-link">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1" /><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" /></svg>
                  Add link
                </button>
              </div>
            </div>
            <div class="att-grid" id="att-images" hidden></div>
            <div class="att-list" id="att-files" hidden></div>
            <div class="att-list" id="att-links" hidden></div>
            <p class="att-empty" id="att-empty">Drop files here, paste an image, or add a link.</p>
          </section>

          <p class="detail-meta" id="detail-meta"></p>
        </div>

        <div class="drop-overlay" id="drop-overlay" hidden>
          <div class="drop-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5" /><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>
            <span>Drop files to attach</span>
          </div>
        </div>
      </section>

      <div class="toast" id="toast" role="status" hidden></div>
    </main>
  </body>
</html>
